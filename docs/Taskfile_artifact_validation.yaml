version: '3'

tasks:
  validate_plantuml:
    vars: 
      FILENAMES:
        sh: find -type f -name "*.plantuml"
    cmds:
      - for: {var: FILENAMES, as: FILE}
        cmd: plantuml -checkonly {{.FILE}}

  validate_document_artifacts:
    deps: [validate_plantuml]


  build_documentation:
    cmds:
      - mkdocs build

  documentation:
    cmds:
      - mkdocs serve
