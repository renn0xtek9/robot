---
- name: CharlieIndia (CI) - Setup and Run APT Server
  hosts: "{{ target_host }}"
  become: true

  vars:
    apt_server_hostname: "192.168.178.39"

    apt_server_cert_path: "/etc/apache2/ssl/charlieindia1.crt"
    apt_server_key_path: "/etc/apache2/ssl/charlieindia1_mtls.key"

    apt_server_ca_cert_path: "/etc/apache2/ssl/rootCA_renn0xtek9.crt"
    apt_server_ca_cert_dir: "/etc/apache2/ssl/certs"

    apt_repo_root: "/var/www/packages"

  tasks:

    ###########################################################################
    # Install Packages
    ###########################################################################

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Apache packages
      apt:
        name:
          - apache2
          - apache2-utils
        state: present

    ###############################################################################
    # Install Reprepro
    ###############################################################################

    - name: Install repository packages
      apt:
        name:
          - reprepro
          - gnupg
        state: present

    ###############################################################################
    # Create Repository User
    ###############################################################################

    - name: Create repo user
      user:
        name: repo
        system: true
        create_home: true
        shell: /bin/bash

    ###############################################################################
    # Repository Ownership
    ###############################################################################

    - name: Create repository directory
      file:
        path: "{{ apt_repo_root }}"
        state: directory
        owner: repo
        group: repo
        mode: "0755"

    ###############################################################################
    # Generate Repository GPG Key
    ###############################################################################

    - name: Create GPG batch file
      copy:
        dest: /home/repo/repo-gpg-batch
        owner: repo
        group: repo
        mode: "0600"
        content: |
          Key-Type: RSA
          Key-Length: 4096
          Name-Real: CharlieIndia Repo
          Name-Email: repo@charlieindia.local
          Expire-Date: 0
          %no-protection
          %commit

    - name: Check whether repository key already exists
      become_user: repo
      shell: |
        gpg --list-secret-keys --with-colons | grep '^sec'
      register: repo_key_exists
      failed_when: false
      changed_when: false

    - name: Generate repository signing key
      become_user: repo
      command:
        cmd: gpg --batch --generate-key /home/repo/repo-gpg-batch
      when: repo_key_exists.stdout == ""

    ###############################################################################
    # Obtain Fingerprint
    ###############################################################################

    - name: Read repository key fingerprint
      become_user: repo
      shell: |
        gpg --list-secret-keys \
            --with-colons \
            --fingerprint \
          | awk -F: '/^fpr:/ {print $10; exit}'
      register: repo_fingerprint
      changed_when: false

    - name: Store fingerprint fact
      set_fact:
        repo_gpg_fingerprint: "{{ repo_fingerprint.stdout }}"

    ###############################################################################
    # Reprepro Configuration
    ###############################################################################

    - name: Create reprepro configuration directory
      file:
        path: "{{ apt_repo_root }}/conf"
        state: directory
        owner: repo
        group: repo
        mode: "0755"

    - name: Deploy reprepro distributions file
      template:
        src: apt-server-reprepro-conf.j2
        dest: "{{ apt_repo_root }}/conf/distributions"
        owner: repo
        group: repo
        mode: "0644"

    ###############################################################################
    # Export Public Key
    ###############################################################################

    - name: Export repository public key
      become_user: repo
      shell: |
        gpg --armor \
            --export {{ repo_gpg_fingerprint }} \
          > {{ apt_repo_root }}/repo-public.asc
      args:
        creates: "{{ apt_repo_root }}/repo-public.asc"

    - name: Ensure public key is readable
      file:
        path: "{{ apt_repo_root }}/repo-public.asc"
        owner: repo
        group: repo
        mode: "0644"

    ###############################################################################
    # Run reprrepo to populate file systme
    ###############################################################################
 
    - name: Initiate filesystem with reprepo 
      become_user: repo 
      shell: reprepro -b {{ apt_repo_root }} export stable

    ###########################################################################
    # Remove Broken Config First
    ###########################################################################

    - name: Remove enabled apt-server config if present
      file:
        path: /etc/apache2/sites-enabled/apt-server.conf
        state: absent

    - name: Remove available apt-server config if present
      file:
        path: /etc/apache2/sites-available/apt-server.conf
        state: absent

    ###########################################################################
    # Enable Apache Modules BEFORE deploying config
    ###########################################################################

    - name: Enable required Apache modules
      command: "a2enmod {{ item }}"
      loop:
        - ssl
        - rewrite
        - headers
        - mime
        - dir
        - deflate
      register: a2enmod_result
      changed_when: "'already enabled' not in a2enmod_result.stdout"

    ###########################################################################
    # Create Directories
    ###########################################################################

    - name: Create repository directory
      file:
        path: "{{ apt_repo_root }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Create SSL directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/apache2/ssl
        - /etc/apache2/ssl/certs

    ###########################################################################
    # Deploy Config
    ###########################################################################

    - name: Deploy Apache vhost
      template:
        src: apt-server-vhost.conf.j2
        dest: /etc/apache2/sites-available/apt-server.conf
        mode: "0644"

    - name: Enable apt-server site
      command: a2ensite apt-server.conf
      register: a2ensite_result
      changed_when: "'already enabled' not in a2ensite_result.stdout"

    - name: Disable default site
      command: a2dissite 000-default.conf
      register: a2dissite_result
      changed_when: "'already disabled' not in a2dissite_result.stdout"
      ignore_errors: true

    ###########################################################################
    # Validate Config
    ###########################################################################

    - name: Validate Apache configuration
      command: apache2ctl configtest
      changed_when: false

    ###########################################################################
    # Restart Apache
    ###########################################################################

    - name: Restart Apache2
      systemd:
        name: apache2
        state: restarted
        enabled: true

    ###########################################################################
    # Verify Service
    ###########################################################################

    - name: Wait for HTTPS service
      wait_for:
        host: localhost
        port: 443
        timeout: 30

    - name: Display success message
      debug:
        msg: >
          Apache APT repository with mTLS is running on
          https://{{ apt_server_hostname }}/
